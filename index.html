<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consulta de Estoque — DEV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitulo {
      margin: 0 0 24px;
      color: #6b7280;
    }

    .painel {
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .linha-busca {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 13px;
      font-size: 18px;
      border: 1px solid #9ca3af;
      border-radius: 8px;
    }

    button {
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 700;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin: 18px 0 10px;
      color: #4b5563;
    }

    .resultado {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .resultado:last-child {
      border-bottom: 0;
    }

    .modelo {
      font-weight: 700;
    }

    .cor {
      margin-top: 4px;
      color: #6b7280;
    }

    .seletor {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border: 2px solid #9ca3af;
      border-radius: 50%;
    }
    .resultado {
  cursor: pointer;
}

.resultado.selecionado {
  padding-left: 10px;
  padding-right: 10px;
  background: #eef2f7;
  border-radius: 8px;
}

.seletor.selecionado {
  background: #111827;
  border-color: #111827;
  box-shadow: inset 0 0 0 4px #ffffff;
}
    .erro {
      color: #b91c1c !important;
    }
    .barra-selecao {
  position: sticky;
  bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding: 12px 14px;
  background: #111827;
  color: #ffffff;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
}

.barra-selecao[hidden] {
  display: none;
}

.barra-selecao button {
  padding: 10px 14px;
  background: #ffffff;
  color: #111827;
}

.barra-selecao button:disabled {
  opacity: 0.45;
}

    @media (max-width: 420px) {
      .linha-busca {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Consulta de Estoque</h1>

    <p class="subtitulo">
      Ambiente de desenvolvimento
    </p>

    <section class="painel">
      <label for="tamanho">
        Numeração
      </label>

      <div class="linha-busca">
        <input
          id="tamanho"
          type="number"
          min="18"
          max="48"
          step="1"
          inputmode="numeric"
          placeholder="Ex.: 37"
        >

        <button
          id="botaoBuscar"
          type="button"
        >
          Buscar modelos
        </button>
      </div>

      <p id="status"></p>

      <div id="resultados"></div>
      <div
  id="barraSelecao"
  class="barra-selecao"
  hidden
>
  <span id="contadorSelecionados">
    0 selecionados
  </span>

  <button
    id="botaoCompartilhar"
    type="button"
    disabled
  >
    Compartilhar
  </button>
</div>
    </section>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwUJJCGzZ7j63nOiajISFco-EHiFQG8T2ZDDKfvck0F9-2AN9TP-30p9embQ9vnFXpQ/exec';

    const campoTamanho =
      document.getElementById('tamanho');

    const botaoBuscar =
      document.getElementById('botaoBuscar');

    const statusElemento =
      document.getElementById('status');

    const resultadosElemento =
      document.getElementById('resultados');

    const barraSelecao =
  document.getElementById('barraSelecao');

const contadorSelecionados =
  document.getElementById('contadorSelecionados');

const botaoCompartilhar =
  document.getElementById('botaoCompartilhar');

const selecionados = new Map();


    function mostrarStatus(mensagem, erro = false) {
      statusElemento.textContent = mensagem;

      statusElemento.classList.toggle(
        'erro',
        erro
      );
    }


    function limparResultados() {
  resultadosElemento.replaceChildren();

  selecionados.clear();

  atualizarBarraSelecao();
}
function atualizarBarraSelecao() {
  const quantidade = selecionados.size;

  barraSelecao.hidden = quantidade === 0;

  contadorSelecionados.textContent =
    quantidade === 1
      ? '1 selecionado'
      : quantidade + ' selecionados';

  botaoCompartilhar.disabled =
    quantidade === 0;
}


function alternarSelecao(produto, linha, seletor) {
  const idProduto = produto.idProduto;

  if (selecionados.has(idProduto)) {
    selecionados.delete(idProduto);
  } else {
    selecionados.set(idProduto, produto);
  }

  const estaSelecionado =
    selecionados.has(idProduto);

  linha.classList.toggle(
    'selecionado',
    estaSelecionado
  );

  seletor.classList.toggle(
    'selecionado',
    estaSelecionado
  );

  atualizarBarraSelecao();
}

    function exibirResultados(dados) {
  limparResultados();

  const modelos = dados.modelos || [];

  if (modelos.length === 0) {
    mostrarStatus('Nenhum disponível.');
    return;
  }

  mostrarStatus(
    modelos.length +
    ' modelo(s) encontrado(s).'
  );

  modelos.forEach(produto => {
    const linha =
      document.createElement('div');

    linha.className = 'resultado';
    linha.tabIndex = 0;
    linha.setAttribute('role', 'button');

    const textos =
      document.createElement('div');

    const modelo =
      document.createElement('div');

    modelo.className = 'modelo';
    modelo.textContent = produto.modelo;

    const cor =
      document.createElement('div');

    cor.className = 'cor';
    cor.textContent = produto.cor;

    const seletor =
      document.createElement('div');

    seletor.className = 'seletor';

    linha.addEventListener('click', () => {
      alternarSelecao(
        produto,
        linha,
        seletor
      );
    });

    linha.addEventListener(
      'keydown',
      evento => {
        if (
          evento.key === 'Enter' ||
          evento.key === ' '
        ) {
          evento.preventDefault();

          alternarSelecao(
            produto,
            linha,
            seletor
          );
        }
      }
    );

    textos.append(modelo, cor);
    linha.append(textos, seletor);

    resultadosElemento.appendChild(linha);
  });
}


    function consultarEstoque(tamanho) {
      return new Promise((resolve, reject) => {
        const nomeCallback =
          'appLojaCallback_' + Date.now();

        const script =
          document.createElement('script');

        const tempoLimite = setTimeout(() => {
          limparConsulta();

          reject(
            new Error(
              'O backend demorou para responder.'
            )
          );
        }, 15000);


        function limparConsulta() {
          clearTimeout(tempoLimite);

          delete window[nomeCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }


        window[nomeCallback] = resposta => {
          limparConsulta();

          if (!resposta || resposta.sucesso !== true) {
            reject(
              new Error(
                resposta && resposta.erro
                  ? resposta.erro
                  : 'Resposta inválida do backend.'
              )
            );

            return;
          }

          resolve(resposta.dados);
        };


        const parametros =
          new URLSearchParams({
            acao: 'buscarModelosPorTamanho',
            tamanho: String(tamanho),
            callback: nomeCallback
          });

        script.src =
          API_URL + '?' + parametros.toString();

        script.onerror = () => {
          limparConsulta();

          reject(
            new Error(
              'Não foi possível acessar o backend.'
            )
          );
        };

        document.body.appendChild(script);
      });
    }


    async function buscar() {
      const tamanho =
        Number(campoTamanho.value);

      if (
        !Number.isInteger(tamanho) ||
        tamanho < 18 ||
        tamanho > 48
      ) {
        limparResultados();

        mostrarStatus(
          'Informe um tamanho inteiro entre 18 e 48.',
          true
        );

        campoTamanho.focus();
        return;
      }

      botaoBuscar.disabled = true;

      limparResultados();
      mostrarStatus('Consultando estoque...');

      try {
        const dados =
          await consultarEstoque(tamanho);

        exibirResultados(dados);

      } catch (erro) {
        limparResultados();

        mostrarStatus(
          erro.message ||
          'Erro ao consultar o estoque.',
          true
        );

      } finally {
        botaoBuscar.disabled = false;
      }
    }


    botaoBuscar.addEventListener(
      'click',
      buscar
    );


    campoTamanho.addEventListener(
      'keydown',
      evento => {
        if (evento.key === 'Enter') {
          buscar();
        }
      }
    );
  </script>
</body>
</html>
