<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Atualizar Estoque — DEV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitulo {
      margin: 0;
      color: #6b7280;
    }

    .link-voltar {
      flex: 0 0 auto;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      background: #e5e7eb;
      color: #111827;
      border-radius: 8px;
    }

    .painel {
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
    }

    .grupo-campo {
      margin-bottom: 18px;
    }

    label,
    .titulo-secao {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      padding: 13px;
      font-size: 16px;
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #9ca3af;
      border-radius: 8px;
    }

    input:disabled,
    select:disabled {
      background: #f3f4f6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin: 0 0 16px;
      color: #4b5563;
    }

    .erro {
      color: #b91c1c !important;
    }

    .secao-lista {
      margin-top: 22px;
    }

    .cabecalho-lista {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    .cabecalho-lista .titulo-secao {
      margin: 0;
    }

    .contador {
      font-size: 14px;
      color: #6b7280;
    }

    .mensagem-vazia {
      margin: 14px 0 0;
      color: #6b7280;
    }

    .produto {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .produto:last-child {
      border-bottom: 0;
    }

    .modelo {
      font-weight: 700;
    }

    .cor {
      margin-top: 4px;
      color: #6b7280;
    }

    .tipo-entrada {
      flex: 0 0 auto;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2f7;
      color: #374151;
      border-radius: 999px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      body {
        padding: 18px 12px;
      }

      .topo {
        align-items: center;
      }

      h1 {
        font-size: 23px;
      }

      .painel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="topo">
      <div>
        <h1>Atualizar Estoque</h1>

        <p class="subtitulo">
          Ambiente de desenvolvimento
        </p>
      </div>

      <a
        class="link-voltar"
        href="index.html"
      >
        Consulta
      </a>
    </header>

    <section class="painel">
      <div class="grupo-campo">
        <label for="responsavel">
          Responsável
        </label>

        <select id="responsavel" disabled>
          <option value="">
            Carregando responsáveis...
          </option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="pesquisaProduto">
          Pesquisar produto
        </label>

        <input
          id="pesquisaProduto"
          type="search"
          placeholder="Digite o modelo ou a cor"
          autocomplete="off"
          disabled
        >
      </div>

      <p id="status">
        Carregando produtos...
      </p>

      <section
        id="secaoFavoritos"
        class="secao-lista"
      >
        <div class="cabecalho-lista">
          <h2 class="titulo-secao">
            Favoritos
          </h2>

          <span
            id="contadorFavoritos"
            class="contador"
          >
            0 modelos
          </span>
        </div>

        <div id="listaFavoritos"></div>

        <p
          id="favoritosVazios"
          class="mensagem-vazia"
        >
          Nenhum favorito cadastrado.
        </p>
      </section>

      <section class="secao-lista">
        <div class="cabecalho-lista">
          <h2 class="titulo-secao">
            Produtos
          </h2>

          <span
            id="contadorProdutos"
            class="contador"
          >
            0 produtos
          </span>
        </div>

        <div id="listaProdutos"></div>

        <p
          id="produtosVazios"
          class="mensagem-vazia"
          hidden
        >
          Nenhum produto encontrado.
        </p>
      </section>
    </section>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwUJJCGzZ7j63nOiajISFco-EHiFQG8T2ZDDKfvck0F9-2AN9TP-30p9embQ9vnFXpQ/exec';

    const campoResponsavel =
      document.getElementById('responsavel');

    const campoPesquisa =
      document.getElementById('pesquisaProduto');

    const statusElemento =
      document.getElementById('status');

    const listaFavoritos =
      document.getElementById('listaFavoritos');

    const favoritosVazios =
      document.getElementById('favoritosVazios');

    const contadorFavoritos =
      document.getElementById('contadorFavoritos');

    const listaProdutos =
      document.getElementById('listaProdutos');

    const produtosVazios =
      document.getElementById('produtosVazios');

    const contadorProdutos =
      document.getElementById('contadorProdutos');

    let produtos = [];
    let sequenciaCallback = 0;

    function mostrarStatus(
      mensagem,
      erro = false
    ) {
      statusElemento.textContent = mensagem;

      statusElemento.classList.toggle(
        'erro',
        erro
      );
    }

    function normalizarBusca(valor) {
      return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function consultarApiJsonp(
      acao,
      parametros = {}
    ) {
      return new Promise((resolve, reject) => {
        sequenciaCallback++;

        const nomeCallback =
          'appLojaAtualizarCallback_' +
          Date.now() + '_' +
          sequenciaCallback;

        const script =
          document.createElement('script');

        const tempoLimite = setTimeout(() => {
          limparConsulta();

          reject(
            new Error(
              'O backend demorou para responder.'
            )
          );
        }, 15000);

        function limparConsulta() {
          clearTimeout(tempoLimite);
          delete window[nomeCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[nomeCallback] = resposta => {
          limparConsulta();

          if (
            !resposta ||
            resposta.sucesso !== true
          ) {
            reject(
              new Error(
                resposta && resposta.erro
                  ? resposta.erro
                  : 'Resposta inválida do backend.'
              )
            );

            return;
          }

          resolve(resposta.dados);
        };

        const consulta =
          new URLSearchParams({
            acao,
            ...parametros,
            callback: nomeCallback
          });

        script.src =
          API_URL + '?' + consulta.toString();

        script.onerror = () => {
          limparConsulta();

          reject(
            new Error(
              'Não foi possível acessar o backend.'
            )
          );
        };

        document.body.appendChild(script);
      });
    }

    function criarLinhaProduto(produto) {
      const linha =
        document.createElement('div');

      linha.className = 'produto';

      const textos =
        document.createElement('div');

      const modelo =
        document.createElement('div');

      modelo.className = 'modelo';
      modelo.textContent = produto.modelo;

      const cor =
        document.createElement('div');

      cor.className = 'cor';
      cor.textContent = produto.cor;

      const tipoEntrada =
        document.createElement('span');

      tipoEntrada.className = 'tipo-entrada';
      tipoEntrada.textContent =
        produto.formaEntradaEstoque;

      textos.append(modelo, cor);
      linha.append(textos, tipoEntrada);

      return linha;
    }

    function renderizarLista(
      elemento,
      itens
    ) {
      elemento.replaceChildren();

      const fragmento =
        document.createDocumentFragment();

      itens.forEach(produto => {
        fragmento.appendChild(
          criarLinhaProduto(produto)
        );
      });

      elemento.appendChild(fragmento);
    }

    function atualizarContador(
      elemento,
      quantidade,
      singular,
      plural
    ) {
      elemento.textContent =
        quantidade === 1
          ? `1 ${singular}`
          : `${quantidade} ${plural}`;
    }

    function renderizarProdutos() {
      const termo =
        normalizarBusca(campoPesquisa.value);

      const produtosFiltrados =
        termo
          ? produtos.filter(produto =>
              normalizarBusca(
                produto.modelo + ' ' + produto.cor
              ).includes(termo)
            )
          : produtos;

      const favoritos =
        produtosFiltrados.filter(
          produto => produto.favorito
        );

      renderizarLista(
        listaFavoritos,
        favoritos
      );

      renderizarLista(
        listaProdutos,
        produtosFiltrados
      );

      atualizarContador(
        contadorFavoritos,
        favoritos.length,
        'modelo',
        'modelos'
      );

      atualizarContador(
        contadorProdutos,
        produtosFiltrados.length,
        'produto',
        'produtos'
      );

      favoritosVazios.hidden =
        favoritos.length > 0;

      produtosVazios.hidden =
        produtosFiltrados.length > 0;

      mostrarStatus(
        termo
          ? `${produtosFiltrados.length} produto(s) encontrado(s).`
          : `${produtos.length} produto(s) carregado(s).`
      );
    }

    function preencherUsuarios(usuarios) {
      campoResponsavel.replaceChildren();

      const opcaoInicial =
        document.createElement('option');

      opcaoInicial.value = '';
      opcaoInicial.textContent =
        'Selecione o responsável';

      campoResponsavel.appendChild(
        opcaoInicial
      );

      usuarios.forEach(usuario => {
        const opcao =
          document.createElement('option');

        opcao.value = usuario.idUsuario;
        opcao.textContent = usuario.nome;

        campoResponsavel.appendChild(opcao);
      });

      campoResponsavel.disabled = false;
    }

    async function carregarDadosIniciais() {
      try {
        const dados =
          await consultarApiJsonp(
            'listarProdutosAtualizarEstoque'
          );

        produtos =
          Array.isArray(dados.produtos)
            ? dados.produtos
            : [];

        preencherUsuarios(
          Array.isArray(dados.usuarios)
            ? dados.usuarios
            : []
        );

        campoPesquisa.disabled = false;
        renderizarProdutos();

      } catch (erro) {
        mostrarStatus(
          erro.message ||
          'Não foi possível carregar o módulo.',
          true
        );
      }
    }

    campoPesquisa.addEventListener(
      'input',
      renderizarProdutos
    );

    carregarDadosIniciais();
  </script>
</body>
</html>
