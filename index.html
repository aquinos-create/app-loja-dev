<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consulta de Estoque — DEV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitulo {
      margin: 0 0 24px;
      color: #6b7280;
    }

    .painel {
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .linha-busca {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 13px;
      font-size: 18px;
      border: 1px solid #9ca3af;
      border-radius: 8px;
    }

    button {
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 700;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin: 18px 0 10px;
      color: #4b5563;
    }

    .resultado {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0 14px 56px;
      position: relative;
      border-bottom: 1px solid #e5e7eb;
    }

    .miniatura-foto {
  position: absolute;
  left: 0;
  top: 50%;
  width: 44px;
  height: 44px;
  transform: translateY(-50%);
  border-radius: 8px;
  overflow: hidden;
  background: #f3f4f6;
    }

 .miniatura-foto img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
    }

    .resultado:last-child {
      border-bottom: 0;
    }

    .modelo {
      font-weight: 700;
    }

    .cor {
      margin-top: 4px;
      color: #6b7280;
    }

    .seletor {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border: 2px solid #9ca3af;
      border-radius: 50%;
    }
    .resultado {
  cursor: pointer;
}

.resultado.selecionado {
  padding-left: 56px;
  padding-right: 10px;
  background: #eef2f7;
  border-radius: 8px;
}

.seletor.selecionado {
  background: #111827;
  border-color: #111827;
  box-shadow: inset 0 0 0 4px #ffffff;
}
    .erro {
      color: #b91c1c !important;
    }
    .barra-selecao {
  position: sticky;
  bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding: 12px 14px;
  background: #111827;
  color: #ffffff;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
}

.barra-selecao[hidden] {
  display: none;
}

.barra-selecao button {
  padding: 10px 14px;
  background: #ffffff;
  color: #111827;
}

.barra-selecao button:disabled {
  opacity: 0.45;
}
dialog {
  width: calc(100% - 32px);
  max-width: 520px;
  padding: 0;
  border: 0;
  border-radius: 12px;
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.55);
}

.modal-conteudo {
  padding: 22px;
}

.modal-conteudo h2 {
  margin: 0 0 12px;
}

.modal-conteudo textarea {
  width: 100%;
  min-height: 110px;
  padding: 12px;
  font: inherit;
  resize: vertical;
  border: 1px solid #9ca3af;
  border-radius: 8px;
}

.modal-acoes {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
}

#botaoVoltar {
  background: #e5e7eb;
  color: #111827;
}
    @media (max-width: 420px) {
      .linha-busca {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Consulta de Estoque</h1>

    <p class="subtitulo">
      Ambiente de desenvolvimento
    </p>

    <section class="painel">
      <label for="tamanho">
        Numeração
      </label>

      <div class="linha-busca">
        <input
          id="tamanho"
          type="number"
          min="18"
          max="48"
          step="1"
          inputmode="numeric"
          placeholder="Ex.: 37"
        >

        <button
          id="botaoBuscar"
          type="button"
        >
          Buscar modelos
        </button>
      </div>

      <p id="status"></p>

      <div id="resultados"></div>
      <div
  id="barraSelecao"
  class="barra-selecao"
  hidden
>
  <span id="contadorSelecionados">
    0 selecionados
  </span>

  <button
    id="botaoCompartilhar"
    type="button"
    disabled
  >
    Compartilhar
  </button>
</div>
    </section>
    <dialog id="modalCompartilhar">
  <div class="modal-conteudo">
    <h2>Compartilhar modelos</h2>

    <p id="resumoCompartilhar"></p>

    <label for="mensagemCompartilhar">
      Mensagem
    </label>

    <textarea id="mensagemCompartilhar">Temos esses modelos disponíveis 😊</textarea>

    <div class="modal-acoes">
      <button
        id="botaoVoltar"
        type="button"
      >
        Voltar
      </button>

      <button
        id="botaoAbrirCompartilhamento"
        type="button"
      >
        Abrir compartilhamento
      </button>
    </div>
  </div>
</dialog>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwUJJCGzZ7j63nOiajISFco-EHiFQG8T2ZDDKfvck0F9-2AN9TP-30p9embQ9vnFXpQ/exec';

    const campoTamanho =
      document.getElementById('tamanho');

    const botaoBuscar =
      document.getElementById('botaoBuscar');

    const statusElemento =
      document.getElementById('status');

    const resultadosElemento =
      document.getElementById('resultados');

    const barraSelecao =
  document.getElementById('barraSelecao');

const contadorSelecionados =
  document.getElementById('contadorSelecionados');

const botaoCompartilhar =
  document.getElementById('botaoCompartilhar');

    const modalCompartilhar =
  document.getElementById('modalCompartilhar');

const resumoCompartilhar =
  document.getElementById('resumoCompartilhar');

const mensagemCompartilhar =
  document.getElementById('mensagemCompartilhar');

const botaoVoltar =
  document.getElementById('botaoVoltar');

const botaoAbrirCompartilhamento =
  document.getElementById('botaoAbrirCompartilhamento');
const selecionados = new Map();
    let arquivosFotoPreparados = [];


    function mostrarStatus(mensagem, erro = false) {
      statusElemento.textContent = mensagem;

      statusElemento.classList.toggle(
        'erro',
        erro
      );
    }


    function limparResultados() {
  resultadosElemento.replaceChildren();

  selecionados.clear();

  atualizarBarraSelecao();
}
function atualizarBarraSelecao() {
  const quantidade = selecionados.size;

  barraSelecao.hidden = quantidade === 0;

  contadorSelecionados.textContent =
    quantidade === 1
      ? '1 selecionado'
      : quantidade + ' selecionados';

  botaoCompartilhar.disabled =
    quantidade === 0;
}


function alternarSelecao(produto, linha, seletor) {
  const idProduto = produto.idProduto;

  if (selecionados.has(idProduto)) {
    selecionados.delete(idProduto);
  } else {
    selecionados.set(idProduto, produto);
  }

  const estaSelecionado =
    selecionados.has(idProduto);

  linha.classList.toggle(
    'selecionado',
    estaSelecionado
  );

  seletor.classList.toggle(
    'selecionado',
    estaSelecionado
  );

  atualizarBarraSelecao();
}

    function exibirResultados(dados) {
  limparResultados();

  const modelos = dados.modelos || [];

  if (modelos.length === 0) {
    mostrarStatus('Nenhum disponível.');
    return;
  }

  mostrarStatus(
    modelos.length +
    ' modelo(s) encontrado(s).'
  );

  modelos.forEach(produto => {
    const linha =
      document.createElement('div');

    linha.className = 'resultado';
    linha.tabIndex = 0;
    linha.setAttribute('role', 'button');

    const miniatura =
  document.createElement('div');

miniatura.className = 'miniatura-foto';
miniatura.setAttribute('aria-hidden', 'true');

    const textos =
      document.createElement('div');

    const modelo =
      document.createElement('div');

    modelo.className = 'modelo';
    modelo.textContent = produto.modelo;

    const cor =
      document.createElement('div');

    cor.className = 'cor';
    cor.textContent = produto.cor;

    const seletor =
      document.createElement('div');

    seletor.className = 'seletor';

    linha.addEventListener('click', () => {
      alternarSelecao(
        produto,
        linha,
        seletor
      );
    });

    linha.addEventListener(
      'keydown',
      evento => {
        if (
          evento.key === 'Enter' ||
          evento.key === ' '
        ) {
          evento.preventDefault();

          alternarSelecao(
            produto,
            linha,
            seletor
          );
        }
      }
    );

    textos.append(modelo, cor);
    linha.append(miniatura, textos, seletor);

    resultadosElemento.appendChild(linha);
    
    enfileirarMiniaturaProduto(produto, miniatura);
  });
}

   async function carregarMiniaturaProduto(produto, miniatura) {
  try {
    const dadosFoto =
      await consultarFotoProduto(produto.idProduto);

    const imagem =
      document.createElement('img');

    imagem.alt = '';
    imagem.src =
      `data:${dadosFoto.tipo || 'image/jpeg'};base64,${dadosFoto.base64}`;

    miniatura.replaceChildren(imagem);
  } catch (erro) {
    miniatura.replaceChildren();
  }
}
let filaMiniaturas = Promise.resolve();

function enfileirarMiniaturaProduto(produto, miniatura) {
  filaMiniaturas = filaMiniaturas.then(() =>
    carregarMiniaturaProduto(produto, miniatura)
  );
}

  async function abrirModalCompartilhar() {
    mostrarStatus('');
    
  const produtosSelecionados =
    Array.from(selecionados.values());

  const produtoSemFoto =
    produtosSelecionados.find(
      produto =>
        !String(produto.fotoId || '').trim()
    );

  if (produtoSemFoto) {
    mostrarStatus(
      produtoSemFoto.modelo +
        ' — ' +
        produtoSemFoto.cor +
        ' ainda não possui foto cadastrada.',
      true
    );

    return;
  }

  arquivosFotoPreparados = [];

  try {
    for (const produto of produtosSelecionados) {
      const dadosFoto =
        await consultarFotoProduto(produto.idProduto);

      const arquivoFoto =
        transformarFotoEmArquivo(dadosFoto);

      arquivosFotoPreparados.push(arquivoFoto);
    }
  } catch (erro) {
    arquivosFotoPreparados = [];

    mostrarStatus(
      'Não foi possível preparar todas as fotos.',
      true
    );

    return;
  }

  const quantidade = selecionados.size;

  resumoCompartilhar.textContent =
    quantidade === 1
      ? '1 modelo selecionado.'
      : quantidade + ' modelos selecionados.';

  modalCompartilhar.showModal();
}

    async function abrirCompartilhamentoNativo() {
  const produtosSelecionados =
    Array.from(selecionados.values());

  const listaModelos =
    produtosSelecionados
      .map(
        produto =>
          produto.modelo + ' — ' + produto.cor
      )
      .join('\n');

  const mensagem =
    mensagemCompartilhar.value.trim();

  const textoCompartilhamento =
    [mensagem, '', listaModelos]
      .filter(parte => parte !== '')
      .join('\n');

  try {
    if (navigator.share) {
      if (
        arquivosFotoPreparados.length === 0 ||
        arquivosFotoPreparados.length !==
          produtosSelecionados.length
      ) {
        mostrarStatus(
          'As fotos ainda não estão prontas para compartilhamento.',
          true
        );

        return;
      }

      if (
        !navigator.canShare ||
        !navigator.canShare({
          files: arquivosFotoPreparados
        })
      ) {
        mostrarStatus(
          'Este dispositivo não permite compartilhar estas fotos juntas.',
          true
        );

        return;
      }

      const dadosCompartilhamento = {
        text: textoCompartilhamento,
        files: arquivosFotoPreparados
      };

      await navigator.share(dadosCompartilhamento);

      modalCompartilhar.close();
      return;
    }

    await navigator.clipboard.writeText(
      textoCompartilhamento
    );

    modalCompartilhar.close();

    mostrarStatus(
      'Lista copiada. Abra o WhatsApp para enviar.'
    );
  } catch (erro) {
    if (erro && erro.name === 'AbortError') {
      return;
    }

    const nomeErro =
      erro && erro.name
        ? erro.name
        : 'Erro desconhecido';

    const mensagemErro =
      erro && erro.message
        ? erro.message
        : 'Sem detalhes';

    mostrarStatus(
      nomeErro + ': ' + mensagemErro,
      true
    );
  }
}
    
    function consultarEstoque(tamanho) {
      return new Promise((resolve, reject) => {
        const nomeCallback =
          'appLojaCallback_' + Date.now();

        const script =
          document.createElement('script');

        const tempoLimite = setTimeout(() => {
          limparConsulta();

          reject(
            new Error(
              'O backend demorou para responder.'
            )
          );
        }, 15000);


        function limparConsulta() {
          clearTimeout(tempoLimite);

          delete window[nomeCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }


        window[nomeCallback] = resposta => {
          limparConsulta();

          if (!resposta || resposta.sucesso !== true) {
            reject(
              new Error(
                resposta && resposta.erro
                  ? resposta.erro
                  : 'Resposta inválida do backend.'
              )
            );

            return;
          }

          resolve(resposta.dados);
        };


        const parametros =
          new URLSearchParams({
            acao: 'buscarModelosPorTamanho',
            tamanho: String(tamanho),
            callback: nomeCallback
          });

        script.src =
          API_URL + '?' + parametros.toString();

        script.onerror = () => {
          limparConsulta();

          reject(
            new Error(
              'Não foi possível acessar o backend.'
            )
          );
        };

        document.body.appendChild(script);
      });
    }

    function consultarFotoProduto(idProduto) {
  return new Promise((resolve, reject) => {
    const nomeCallback =
      'appLojaFotoCallback_' + Date.now();

    const script =
      document.createElement('script');

    const tempoLimite = setTimeout(() => {
      limparConsultaFoto();

      reject(
        new Error(
          'O backend demorou para responder.'
        )
      );
    }, 15000);

    function limparConsultaFoto() {
      clearTimeout(tempoLimite);

      delete window[nomeCallback];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[nomeCallback] = resposta => {
      limparConsultaFoto();

      if (!resposta || resposta.sucesso !== true) {
        reject(
          new Error(
            resposta && resposta.erro
              ? resposta.erro
              : 'Resposta inválida do backend.'
          )
        );

        return;
      }

      resolve(resposta.dados);
    };

    const parametros =
      new URLSearchParams({
        acao: 'buscarFotoPorProduto',
        idProduto: String(idProduto),
        callback: nomeCallback
      });

    script.src =
      API_URL + '?' + parametros.toString();

    script.onerror = () => {
      limparConsultaFoto();

      reject(
        new Error(
          'Não foi possível acessar o backend.'
        )
      );
    };

    document.body.appendChild(script);
  });
}

    function transformarFotoEmArquivo(dadosFoto) {
  const binario = atob(dadosFoto.base64);
  const bytes = new Uint8Array(binario.length);

  for (let indice = 0; indice < binario.length; indice++) {
    bytes[indice] = binario.charCodeAt(indice);
  }

  return new File(
    [bytes],
    dadosFoto.nomeArquivo || 'produto.jpg',
    {
      type: dadosFoto.tipo || 'image/jpeg'
    }
  );
}
    
    async function buscar() {
      const tamanho =
        Number(campoTamanho.value);

      if (
        !Number.isInteger(tamanho) ||
        tamanho < 18 ||
        tamanho > 48
      ) {
        limparResultados();

        mostrarStatus(
          'Informe um tamanho inteiro entre 18 e 48.',
          true
        );

        campoTamanho.focus();
        return;
      }

      botaoBuscar.disabled = true;

      limparResultados();
      mostrarStatus('Consultando estoque...');

      try {
        const dados =
          await consultarEstoque(tamanho);

        exibirResultados(dados);

      } catch (erro) {
        limparResultados();

        mostrarStatus(
          erro.message ||
          'Erro ao consultar o estoque.',
          true
        );

      } finally {
        botaoBuscar.disabled = false;
      }
    }

    botaoCompartilhar.addEventListener(
  'click',
  abrirModalCompartilhar
);

    botaoVoltar.addEventListener(
  'click',
  () => {
    modalCompartilhar.close();
  }
);

botaoAbrirCompartilhamento.addEventListener(
  'click',
  abrirCompartilhamentoNativo
);
    
    botaoBuscar.addEventListener(
      'click',
      buscar
    );


    campoTamanho.addEventListener(
      'keydown',
      evento => {
        if (evento.key === 'Enter') {
          buscar();
        }
      }
    );
  </script>
</body>
</html>
